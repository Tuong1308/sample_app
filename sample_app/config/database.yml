# MySQL. Versions 5.5.8 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
# And be sure to use new-style password hashing:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: sample_app_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: sample_app_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. Set DB_USERNAME, DB_PASSWORD
# and DB_HOST as environment variables on the production server instead.
production:
  primary: &primary_production
    <<: *default
    database: sample_app_production
  cache:
    <<: *primary_production
    database: sample_app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: sample_app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: sample_app_production_cable
    migrations_paths: db/cable_migrate
